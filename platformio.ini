; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; (!) Take care of blanks and tabs (!)
; =====================================
; It is python style - if you mix up you get unexpected errors, 
; like cannot find "eagle.flash.4m1m.ld"...
;
[platformio]
    default_envs = d1_mini_debug

[env]
    ; Default settings for all environments
    upload_speed    = 460800
    monitor_speed   = 115200

[test]
    ; *****************************************************
    ; Settings for testing runtime
    ; *****************************************************
	framework  		= googletest
	lib_deps		= google/googletest@^1.17.0
	filter_embedded	= embedded/*
	filter_native	= native/*


[common]
    framework     = arduino
    build_flags   =
        -D TEMPLATE_PLACEHOLDER=36              ; $ sign for web templates instead of %
        '-D WIFI_DEFAULT_AP_SSID_PREFIX="LSC"'	; Default WIFI AP SSID Prefix
        '-D DEFAULT_DEVICE_NAME="LSC-Device"'   ; Default Device Name
        '-D WIFI_DEFAULT_PHY_MODE="g"'          ; 802.11g - reduces SDK rate table changes
        ; ESP8266 NONOS SDK: default of the core (2.2.x). The crashes in the SDK / lwIP were caused by
        ; heap corruption (ESPAsyncTCP abort use-after-free, see scripts/patchLibs.py), not by the SDK.
        ; Newer SDK, if needed:  -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK305
        ; Allow to use #pragma directives in source code and enable exception handling
        ; in previous versions it was enabled by -fexceptions flag
        -Wno-unknown-pragmas
        -D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
        -D RADIO_433_RECEIVER_PIN=D2

    board_build.ldscript    = eagle.flash.4m1m.ld 
    board_build.filesystem  = littlefs
    extra_scripts           =
        pre:scripts/patchLibs.py                ; fixes bugs in downloaded libraries (ESPAsyncTCP abort use-after-free)
        scripts/buildSteps.py

    ; Only external libraries - framework libraries (LittleFS, ESP8266WiFi, ESP8266mDNS, ...)
    ; are found by the library dependency finder from the includes.
    ; ArduinoJson is not needed (PLibESPV1 uses JsonNode) - only with the ArduinoJson backend of JsonHelper.h
    ; Versions are pinned - tested combination:
    ;   ESPAsyncTCP 2.0.0      - scripts/patchLibs.py patches this version
    ;   ESPAsyncWebServer 3.10.0 - 3.12.x makes the request constructor private (used in CWebServer.cpp)
    lib_deps      =
        ESP32Async/ESPAsyncTCP @ 2.0.0
        ESP32Async/ESPAsyncWebServer @ 3.10.0
        marvinroger/AsyncMqttClient @ 0.9.0
        https://github.com/sui77/rc-switch

[common_esp8266]
	; Context of ESP8266 Devices...
    monitor_filters         = esp8266_exception_decoder

	; Released ESP8266 Arduino core 3.1.2 (PlatformIO package version 3.30102.0).
	; Before, the git master (3.2.0-dev) was used - crash in lwIP (pbuf_free in ip4_input).
	; Development version, if needed:
	;   platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git
	platform_packages =
		platformio/framework-arduinoespressif8266 @ 3.30102.0

[common_esp32]
	; Context of ESP32 Devices

       

[env:d1_mini_debug]
    platform        = espressif8266
    board           = d1_mini
    framework       = ${common.framework}
    build_type      = debug
    
    platform_packages		= ${common_esp8266.platform_packages}
    board_build.ldscript    = ${common.board_build.ldscript}
    board_build.filesystem  = ${common.board_build.filesystem}

    monitor_filters = 
        ${common_esp8266.monitor_filters}
        log2file


    extra_scripts           = ${common.extra_scripts}
    
    build_flags =
        ${common.build_flags}
        -D TRACE
        -D DEBUGVERSION					; Defines, that this is a debugversion    
        -D DEBUGINFOS					; Main Debug Info to enable Debug Macros
        -D NO_DEBUG_LSC_FILESYSTEM
        -D NO_DEBUG_LSC_SECURITY
        -D NO_DEBUG_LSC_APPL            ; Debug the Application (Main.cpp) - use Serial Monitor
        -D NO_DEBUG_LSC_STATUSHANDLER
        -D NO_DEBUG_LSC_CONFIGHANDLER
        -D NO_DEBUG_LSC_WIFI            ; Wifi Debugging - use Serial Monitor
        -D NO_DEBUG_LSC_HTLM_PAGES
        -D NO_DEBUG_LSC_INPUTPINCONTROLLER
        -D NO_DEBUG_LSC_BUTTON
        -D NO_DEBUG_LSC_WEBSERVER
        -D NO_DEBUG_LSC_WEBROUTES
        -D NO_DEBUG_LSC_WEBSOCKET
        -D NO_DEBUG_LSC_MQTT
        -D NO_DEBUG_LSC_RF433RECEIVER
        -D NO_DEBUG_LSC_DHT_SENSOR
        -D NO_DEBUG_LSC_DISPLAY
        -D NO_DEBUG_LSC_FRONTEND			; Debug the Frontend (WebGUI) - use the Web Developer Tools in the Browser
        -D NO_DEBUG_LSC_ONAIRLIGHT


    lib_compat_mode     = strict
    lib_ldf_mode        = chain

    lib_deps = 
        ${common.lib_deps}

    ; Custom Serial Monitor speed (baud rate)

[env:d1_mini]
    platform    = espressif8266
    board       = d1_mini
    framework   = ${common.framework}
    build_type  = release

    platform_packages		= ${common_esp8266.platform_packages}
    board_build.ldscript    = ${common.board_build.ldscript}
    board_build.filesystem  = ${common.board_build.filesystem}
    monitor_filters = 
        log2file

    extra_scripts = ${common.extra_scripts}
    build_flags =
            ${common.build_flags}

    lib_compat_mode     = strict
    lib_ldf_mode        = chain

    lib_deps = 
        ${common.lib_deps}

        